name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tools/flora-validator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Tools/flora-validator/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Validar fontes e questões
        run: npm run validate -- --json
